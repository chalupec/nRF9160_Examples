# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_BACKEND_UART=y
CONFIG_TFM_LOG_LEVEL_SILENCE=y
CONFIG_UART_CONSOLE=y
CONFIG_RING_BUFFER=y
CONFIG_LOG_PRINTK=n

CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_TFM_SECURE_UART=n





CONFIG_CLOCK_CONTROL=y
CONFIG_CLOCK_CONTROL_NRF=y




# Flash + EEPROM emulation
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

CONFIG_NVS_LOG_LEVEL_INF=y

# Pokud používáš externí SPI flash
##CONFIG_SPI=y
CONFIG_FLASH_PAGE_LAYOUT=y





# Button and LED support
CONFIG_DK_LIBRARY=y

# Newlib
CONFIG_NEWLIB_LIBC=y


CONFIG_ADC=y
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_TIMER0=y

CONFIG_GPIO=y
CONFIG_NRFX_SPIM1=y
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=256



CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_MODEM=y        # Use modem-provided network time
CONFIG_DATE_TIME_AUTO_UPDATE=y  # Auto-update after LTE connects



CONFIG_REBOOT=y



# Networking
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_IPV4=y
#CONFIG_NET_SOCKETS_POSIX_NAMES=y
# Memory



CONFIG_MAIN_STACK_SIZE=16384
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=16384
#CONFIG_THREAD_STACK_SIZE=4096
#CONFIG_HEAP_MEM_POOL_SIZE=2048




CONFIG_STACK_SENTINEL=y
CONFIG_STACK_CANARIES=y
CONFIG_THREAD_NAME=y




# Modem library
CONFIG_MODEM_INFO=y
CONFIG_NRF_MODEM_LIB=y

# LTE link control
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT=y

# MQTT
# STEP 2.1 - Enable and configure the MQTT library
CONFIG_MQTT_LIB=y
CONFIG_MQTT_CLEAN_SESSION=y

# Application
# STEP 2.2 - Configure the broker name, TCP port, topic names, and message
CONFIG_MQTT_PUB_TOPIC="NRF/01/UP_STREAM"
CONFIG_MQTT_PUB_SYS_TOPIC="NRF/01/UP_STREAM_SYS"
CONFIG_MQTT_PUB_SYS_LOG_TOPIC="NRF/01/UP_STREAM_SYS_LOG"
CONFIG_MQTT_SUB_TOPIC="NRF/01/DOWN_STREAM"

CONFIG_BUTTON_EVENT_PUBLISH_MSG="Hi from the nRF91 Series device"
CONFIG_MQTT_BROKER_HOSTNAME="iot-course-but.cloud.shiftr.io"
CONFIG_MQTT_BROKER_PORT=1883


#CONFIG_MQTT_BROKER_HOSTNAME="mqtt.nordicsemi.academy"
#CONFIG_MQTT_BROKER_PORT=1883